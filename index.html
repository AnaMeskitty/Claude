<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dot Letters">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Dot Letters</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: white sheet in the middle, pastel marker tray docked below, scene tabs above. */
:root{
  --paper:#ffffff; --ink:#4a4458; --muted:#a39db0; --tray:#fff6fa; --line:#f0e4ee; --accent:#ff8fb1; --accent2:#9ad7c9;
  --display:"Baloo 2","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#ffffff; --ink:#4a4458; --muted:#a39db0; --tray:#fff6fa; --line:#f0e4ee; --accent:#ff8fb1; --accent2:#9ad7c9 } }
:root[data-theme="dark"]{ --paper:#ffffff; --ink:#4a4458; --muted:#a39db0; --tray:#fff6fa; --line:#f0e4ee; --accent:#ff8fb1; --accent2:#9ad7c9 }
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;box-sizing:border-box;gap:10px;overflow:hidden;touch-action:none}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:24px;margin:0;letter-spacing:-.01em;color:var(--accent)}
.sub{font-size:12px;color:var(--muted)}
.scenes{display:flex;gap:6px;flex-wrap:wrap}
.scenes button{font:600 13px var(--display);color:var(--ink);background:var(--tray);border:2px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.scenes button.on{border-color:var(--accent);background:#ffe3ec}
.scenes button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{background:var(--paper);border-radius:16px;border:2px solid var(--line);max-width:100%;max-height:100%;touch-action:none;cursor:crosshair}
.tray{background:var(--tray);border:2px solid var(--line);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.key{display:flex;gap:8px;flex-wrap:wrap}
.k{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 6px;border-radius:999px;border:2px solid transparent;background:var(--paper);cursor:pointer;font:700 15px var(--body);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.k.on{border-color:var(--ink)}
.k .sw{width:22px;height:22px;border-radius:50%}
.k .pct{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.k.done .pct{color:var(--accent)}
.k:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.pal{display:flex;gap:5px;flex-wrap:wrap}
.pal button{width:24px;height:24px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.pal button:focus-visible{outline:2px solid var(--accent)}
button.txt{font:700 12px var(--body);color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer}
button.txt:focus-visible{outline:2px solid var(--accent)}
.spacer{flex:1}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>

</head><body><header>
  <h1>Dot Letters</h1>
  <div class="scenes" id="scenes"></div>
  <span class="sub" id="hint">Pick a letter in the tray, then tap its letters on the page.</span>
</header>
<div id="stage"><canvas id="c"></canvas></div>
<div class="tray">
  <div class="key" id="key"></div>
  <div class="row">
    <span>Color for <b id="curL">A</b>:</span>
    <div class="pal" id="pal"></div>
    <span class="spacer"></span>
    <button class="txt" id="pen">Pencil only: off</button>
    <button class="txt" id="auto">Any letter mode: off</button>
    <button class="txt" id="reset">Clear page</button>
  </div>
</div>

<script>
// ---------- Palette: soft pastels ----------
const W=900,H=640;
const PALETTE=['#ff8fb1','#ffb3c6','#ffcf9e','#fff1a8','#c8e7a0','#9ad7c9','#a6d8ff','#c4b5fd','#f4c2f0','#c9a98b','#f7a8a8','#8fd3f4'];
const LETTERS='ABCDEF'.split('');

// ---------- Scenes: regions tagged with letters, drawn lowest first ----------
function circ(x,y,r){const p=new Path2D();p.arc(x,y,r,0,Math.PI*2);return p}
function ell(x,y,rx,ry,rot=0){const p=new Path2D();p.ellipse(x,y,rx,ry,rot,0,Math.PI*2);return p}
function poly(pts){const p=new Path2D();p.moveTo(...pts[0]);pts.slice(1).forEach(q=>p.lineTo(...q));p.closePath();return p}
function rrect(x,y,w,h,r){const p=new Path2D();p.roundRect(x,y,w,h,r);return p}
function heart(x,y,s){const p=new Path2D();p.moveTo(x,y+s*0.9);p.bezierCurveTo(x-s*1.3,y-s*0.1,x-s*0.6,y-s*1.0,x,y-s*0.35);p.bezierCurveTo(x+s*0.6,y-s*1.0,x+s*1.3,y-s*0.1,x,y+s*0.9);return p}
function star(x,y,R,r){const p=new Path2D();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,d=i%2?r:R;i?p.lineTo(x+Math.cos(a)*d,y+Math.sin(a)*d):p.moveTo(x+Math.cos(a)*d,y+Math.sin(a)*d)}p.closePath();return p}
function union(...ps){const p=new Path2D();ps.forEach(q=>p.addPath(q));return p}

const SCENES={
  'Kitty':{colors:['#a6d8ff','#ffcf9e','#ffb3c6','#fff1a8','#c4b5fd','#ff8fb1'],build(){const r=[];
    r.push({l:'A',p:rrect(0,0,W,H,0)});                                   // sky
    r.push({l:'E',p:union(circ(120,120,34),circ(160,105,44),circ(205,122,32),rrect(120,122,85,32,0))});
    r.push({l:'E',p:union(circ(700,90,30),circ(740,78,38),circ(780,94,28),rrect(700,94,80,28,0))});
    r.push({l:'D',p:rrect(0,470,W,H-470,0)});                              // grass
    r.push({l:'B',p:ell(450,420,170,110)});                                // body
    r.push({l:'B',p:union(ell(640,380,30,70,-0.6),circ(650,320,30))});     // tail
    r.push({l:'B',p:union(poly([[330,215],[345,120],[405,200]]),poly([[570,215],[555,120],[495,200]]))}); // ears
    r.push({l:'C',p:union(poly([[345,205],[352,150],[392,200]]),poly([[555,205],[548,150],[508,200]]))}); // inner ears
    r.push({l:'B',p:ell(450,250,130,105)});                                // head
    r.push({l:'F',p:union(circ(395,240,22),circ(505,240,22))});            // eyes
    r.push({l:'C',p:heart(450,300,16)});                                   // nose
    r.push({l:'C',p:union(circ(350,300,22),circ(550,300,22))});            // cheeks
    r.push({l:'C',p:union(heart(150,330,40),heart(780,250,34),heart(820,520,36),heart(90,560,30))});
    return r}},
  'Cupcake':{colors:['#fff1a8','#ffb3c6','#c9a98b','#ff8fb1','#a6d8ff','#f4c2f0'],build(){const r=[];
    r.push({l:'A',p:rrect(0,0,W,H,0)});
    r.push({l:'C',p:poly([[300,370],[600,370],[560,600],[340,600]])});     // wrapper
    r.push({l:'A',p:union(poly([[340,380],[360,380],[350,595],[340,595]]),poly([[440,380],[460,380],[455,598],[445,598]]),poly([[540,380],[560,380],[550,595],[540,595]]))}); // pleats
    r.push({l:'B',p:union(ell(450,370,170,55),circ(380,310,60),circ(520,310,60),circ(450,250,65),circ(410,215,45),circ(490,215,45),circ(450,180,40))}); // frosting
    r.push({l:'D',p:circ(450,150,26)});                                    // cherry
    r.push({l:'E',p:union(star(140,140,42,19),star(760,120,46,21),star(800,480,36,16),star(110,470,38,17),star(230,560,30,13),star(680,560,32,14))});
    r.push({l:'F',p:union(circ(400,330,14),circ(470,300,14),circ(520,350,14),circ(430,245,13),circ(480,220,13),circ(360,360,13),circ(540,300,13))}); // sprinkles
    return r}},
  'Mushroom':{colors:['#c8e7a0','#ff8fb1','#fff1a8','#ffcf9e','#a6d8ff','#c4b5fd'],build(){const r=[];
    r.push({l:'A',p:rrect(0,0,W,H,0)});
    r.push({l:'A',p:union(ell(200,560,180,60),ell(700,570,200,60))});       // soft hills (same letter, outline only)
    r.push({l:'F',p:union(circ(120,110,32),circ(165,95,40),circ(210,112,30),rrect(120,112,90,30,0))});
    r.push({l:'D',p:rrect(380,330,140,250,30)});                           // stem
    r.push({l:'E',p:union(rrect(410,420,36,50,12),circ(428,420,18))});     // door
    r.push({l:'B',p:union(ell(450,310,230,120),rrect(220,310,460,40,0))}); // cap
    r.push({l:'C',p:union(circ(330,270,30),circ(450,230,36),circ(570,280,28),circ(390,330,18),circ(520,335,20),circ(260,320,16),circ(640,322,16))}); // spots
    r.push({l:'C',p:union(circ(140,470,22),circ(118,440,14),circ(162,440,14),circ(130,452,10))}); // little flower
    r.push({l:'C',p:union(circ(790,500,22),circ(768,470,14),circ(812,470,14),circ(780,482,10))});
    r.push({l:'D',p:union(rrect(136,490,8,70,4),rrect(786,520,8,60,4))});
    return r}},
};

// ---------- Build the letter field for a scene ----------
const probe=document.createElement('canvas').getContext('2d');
let REGIONS=[],LET=[],sceneName='Kitty',colors=[];
function regionAt(x,y){ for(let i=REGIONS.length-1;i>=0;i--){ if(probe.isPointInPath(REGIONS[i].p,x,y)) return i; } return 0; }
function seed(s){ return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; } }
function scatter(){
  const rnd=seed(42), step=24, R=13; LET=[];
  for(let y=step*0.8;y<H-8;y+=step) for(let x=step*0.8+(Math.round(y/step)%2)*step/2;x<W-8;x+=step){
    const px=x+(rnd()-.5)*10, py=y+(rnd()-.5)*10;
    const ri=regionAt(px,py);
    const big=[[R,0],[-R,0],[0,R],[0,-R]].every(([dx,dy])=>regionAt(px+dx,py+dy)===ri);
    LET.push({x:px,y:py,l:REGIONS[ri].l,big,done:false});
  }
}
function loadScene(name){
  sceneName=name; REGIONS=SCENES[name].build(); colors=SCENES[name].colors.slice(); scatter();
  try{ const s=JSON.parse(localStorage.getItem('dotletters:'+name)||'null'); if(s&&s.done&&s.done.length===LET.length){ colors=s.colors; s.done.forEach((d,i)=>{LET[i].done=!!d; LET[i].k=d||1;}); } }catch(e){}
  cur='A'; document.getElementById('curL').textContent='A'; renderScenes(); renderKey(); renderPal(); draw(0);
}
function save(){ try{ localStorage.setItem('dotletters:'+sceneName,JSON.stringify({colors,done:LET.map(l=>l.done?+(l.k||1).toFixed(2):0)})); }catch(e){} }

// ---------- State ----------
let cur='A', anyMode=false;

// ---------- Drawing ----------
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const dpr=Math.min(2,window.devicePixelRatio||1);
cv.width=W*dpr; cv.height=H*dpr; ctx.scale(dpr,dpr);
const pops=[];
function draw(t){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#e9dfe8'; ctx.lineWidth=1.4;
  REGIONS.slice(1).forEach(r=>ctx.stroke(r.p));
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#b9b2c4';
  for(const L of LET){ if(L.done) continue; ctx.font=(L.big?'700 15px':'700 9px')+' Nunito, sans-serif'; ctx.fillText(L.l,L.x,L.y); }
  for(const L of LET){ if(!L.done) continue; const r=(L.big?13:7.5)*(L.k||1);
    ctx.fillStyle=colors[LETTERS.indexOf(L.l)]; ctx.globalAlpha=.95; ctx.beginPath(); ctx.arc(L.x,L.y,r,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; }
  for(let i=pops.length-1;i>=0;i--){ const p=pops[i], k=(t-p.t)/260; if(k>=1){pops.splice(i,1);continue}
    ctx.strokeStyle=p.c; ctx.globalAlpha=1-k; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(p.x,p.y,p.r+k*10,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1; }
  if(pops.length) requestAnimationFrame(draw);
}

// ---------- Sound ----------
let AC=null;
function tap(big){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(), g=AC.createGain();
  o.type='sine'; o.frequency.value=big?220:330; g.gain.setValueAtTime(.0001,AC.currentTime); g.gain.exponentialRampToValueAtTime(.25,AC.currentTime+.01); g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.09);
  o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime+.1);}catch(e){} }

// ---------- Interaction (Pencil-aware) ----------
function canvasPoint(e){ const b=cv.getBoundingClientRect(); return {x:(e.clientX-b.left)*W/b.width, y:(e.clientY-b.top)*H/b.height}; }
let down=false;
function hit(pt,pressure){
  let best=null,bd=1e9;
  for(const L of LET){ if(L.done) continue; const d=Math.hypot(L.x-pt.x,L.y-pt.y); const reach=L.big?16:11; if(d<reach&&d<bd){bd=d;best=L} }
  if(!best) return;
  if(!anyMode && best.l!==cur) return;
  best.k = 0.85 + Math.min(1,Math.max(0,pressure))*0.45;
  best.done=true; pops.push({x:best.x,y:best.y,r:(best.big?13:7.5)*best.k,c:colors[LETTERS.indexOf(best.l)],t:performance.now()});
  if(navigator.vibrate) navigator.vibrate(8);
  tap(best.big); save(); renderKey(); requestAnimationFrame(draw);
}
let penSeen=0, penOnly=false;
function accept(e){
  if(e.pointerType==='pen'){ penSeen=performance.now(); return true; }
  if(e.pointerType==='touch'){ if(penOnly) return false; return performance.now()-penSeen>3000; }
  return true;
}
function pressureOf(e){ return e.pointerType==='pen' ? (e.pressure||0.5) : 0.5; }
cv.addEventListener('pointerdown',e=>{ if(!accept(e)) return; down=true; cv.setPointerCapture(e.pointerId); hit(canvasPoint(e),pressureOf(e)); });
cv.addEventListener('pointermove',e=>{ if(down&&accept(e)) hit(canvasPoint(e),pressureOf(e)); });
cv.addEventListener('pointerup',()=>down=false); cv.addEventListener('pointercancel',()=>down=false);
document.getElementById('pen').onclick=function(){ penOnly=!penOnly; this.textContent='Pencil only: '+(penOnly?'on':'off'); };

// ---------- Tray UI ----------
const keyEl=document.getElementById('key'), palEl=document.getElementById('pal'), scEl=document.getElementById('scenes');
function renderScenes(){
  scEl.innerHTML='';
  Object.keys(SCENES).forEach(n=>{ const b=document.createElement('button'); b.textContent=n; b.id='scene-'+n; b.className=n===sceneName?'on':''; b.onclick=()=>loadScene(n); scEl.appendChild(b); });
}
function renderKey(){
  keyEl.innerHTML='';
  LETTERS.forEach((l,i)=>{
    const all=LET.filter(x=>x.l===l), n=all.filter(x=>x.done).length, pct=all.length?Math.round(100*n/all.length):0;
    const b=document.createElement('button'); b.className='k'+(l===cur?' on':'')+(pct===100?' done':''); b.id='key-'+l;
    b.innerHTML=`<span class="sw" style="background:${colors[i]}"></span>${l}<span class="pct">${pct}%</span>`;
    b.onclick=()=>{cur=l; document.getElementById('curL').textContent=l; renderKey(); renderPal();};
    keyEl.appendChild(b);
  });
  const total=LET.filter(x=>x.done).length;
  document.getElementById('hint').textContent= total===LET.length ? 'Page complete. So cute!' : `${total} of ${LET.length} dots placed`;
}
function renderPal(){
  palEl.innerHTML='';
  PALETTE.forEach(c=>{ const b=document.createElement('button'); b.style.background=c; b.title=c; b.id='pal-'+c.slice(1);
    b.style.outline = colors[LETTERS.indexOf(cur)]===c ? '3px solid var(--ink)' : '';
    b.onclick=()=>{ colors[LETTERS.indexOf(cur)]=c; save(); renderKey(); renderPal(); draw(0); }; palEl.appendChild(b); });
}
document.getElementById('auto').onclick=function(){ anyMode=!anyMode; this.textContent='Any letter mode: '+(anyMode?'on':'off'); };
document.getElementById('reset').onclick=()=>{ LET.forEach(l=>{l.done=false;l.k=1}); save(); renderKey(); draw(0); };
loadScene('Kitty');
document.fonts&&document.fonts.ready.then(()=>draw(0));
</script>

<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");</script></body></html>
