<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dot Letters">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Dot Letters</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Nunito:wght@500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: paper sheet in the middle, marker tray (the key) docked below it like the detachable tray in the pad. */
:root{
  --paper:#fbf8f1; --ink:#2b2a27; --muted:#7b7568; --tray:#efe9dd; --line:#d9d2c3; --accent:#c8552f;
  --display:"Fraunces",Georgia,serif; --body:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#1d1c1a; --ink:#ebe6da; --muted:#9a9388; --tray:#2a2826; --line:#3d3a35; --accent:#e4744e; color-scheme:dark } }
:root[data-theme="dark"]{ --paper:#1d1c1a; --ink:#ebe6da; --muted:#9a9388; --tray:#2a2826; --line:#3d3a35; --accent:#e4744e; color-scheme:dark }
html,body{height:100%}
body{margin:0;background:var(--tray);color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;box-sizing:border-box;gap:10px;overflow:hidden;touch-action:none}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:600;font-size:22px;margin:0;letter-spacing:-.01em}
.sub{font-size:12px;color:var(--muted)}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{background:var(--paper);border-radius:6px;box-shadow:0 1px 0 var(--line),0 10px 30px rgba(0,0,0,.12);max-width:100%;max-height:100%;touch-action:none;cursor:crosshair}
.tray{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.key{display:flex;gap:8px;flex-wrap:wrap}
.k{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 6px;border-radius:999px;border:2px solid transparent;background:var(--tray);cursor:pointer;font:700 15px var(--body);color:var(--ink);position:relative}
.k.on{border-color:var(--ink)}
.k .sw{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.k .pct{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.k.done .pct{color:var(--accent)}
.k:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.pal{display:flex;gap:5px;flex-wrap:wrap}
.pal button{width:24px;height:24px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.pal button:focus-visible{outline:2px solid var(--accent)}
button.txt{font:700 12px var(--body);color:var(--ink);background:none;border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer}
button.txt:focus-visible{outline:2px solid var(--accent)}
.spacer{flex:1}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>

</head><body><header>
  <h1>Dot Letters</h1>
  <span class="sub" id="hint">Pick a letter in the tray, then tap its letters on the page.</span>
</header>
<div id="stage"><canvas id="c"></canvas></div>
<div class="tray">
  <div class="key" id="key"></div>
  <div class="row">
    <span>Color for <b id="curL">A</b>:</span>
    <div class="pal" id="pal"></div>
    <span class="spacer"></span>
    <button class="txt" id="pen">Pencil only: off</button>
    <button class="txt" id="auto">Any letter mode: off</button>
    <button class="txt" id="reset">Clear page</button>
  </div>
</div>

<script>
// ---------- Scene definition: regions, each tagged with a letter ----------
const W=900,H=640;
const PALETTE=['#e4572e','#f3a712','#f7d87c','#76b041','#2e8b6e','#3a86c9','#6c4fc1','#d85b9a','#8a5a3c','#2b2a27'];
const LETTERS='ABCDEF'.split('');
const DEFAULT=['#3a86c9','#f3a712','#76b041','#2e8b6e','#8a5a3c','#e4572e'];

function buildRegions(){
  const r=[];
  const sky=new Path2D(); sky.rect(0,0,W,H); r.push({l:'A',p:sky});               // sky (drawn first = lowest)
  const sun=new Path2D(); sun.arc(690,140,70,0,Math.PI*2); r.push({l:'B',p:sun});
  const hills=new Path2D(); hills.moveTo(0,420); hills.bezierCurveTo(200,300,380,340,520,400); hills.bezierCurveTo(680,460,780,380,900,420); hills.lineTo(900,H); hills.lineTo(0,H); r.push({l:'C',p:hills});
  const ground=new Path2D(); ground.moveTo(0,520); ground.bezierCurveTo(300,490,600,540,900,500); ground.lineTo(900,H); ground.lineTo(0,H); r.push({l:'F',p:ground});
  const trunk=new Path2D(); trunk.moveTo(255,560); trunk.lineTo(275,330); trunk.lineTo(305,330); trunk.lineTo(325,560); r.push({l:'E',p:trunk});
  const leaves=new Path2D(); leaves.arc(290,260,95,0,Math.PI*2); leaves.arc(215,310,60,0,Math.PI*2); leaves.arc(370,305,65,0,Math.PI*2); r.push({l:'D',p:leaves});
  const cloud=new Path2D(); cloud.arc(500,120,38,0,Math.PI*2); cloud.arc(545,105,46,0,Math.PI*2); cloud.arc(595,125,34,0,Math.PI*2); cloud.rect(500,125,95,34); r.push({l:'A',p:cloud,cloud:true});
  return r;
}
const REGIONS=buildRegions();

// Region lookup: topmost region containing the point.
const probe=document.createElement('canvas').getContext('2d');
function regionAt(x,y){ for(let i=REGIONS.length-1;i>=0;i--){ if(probe.isPointInPath(REGIONS[i].p,x,y)) return i; } return 0; }

// Scatter letters on a jittered grid. A letter is "large" when the region is the same
// in all four directions at distance R, else "small" (near an edge = detail).
let LET=[];
function seed(s){ return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; } }
function scatter(){
  const rnd=seed(42), step=27, R=15; LET=[];
  for(let y=step*0.8;y<H-8;y+=step) for(let x=step*0.8+(Math.round(y/step)%2)*step/2;x<W-8;x+=step){
    const px=x+(rnd()-.5)*10, py=y+(rnd()-.5)*10;
    const ri=regionAt(px,py);
    const big=[[R,0],[-R,0],[0,R],[0,-R]].every(([dx,dy])=>regionAt(px+dx,py+dy)===ri);
    LET.push({x:px,y:py,l:REGIONS[ri].l,big,done:false});
  }
}
scatter();

// ---------- State ----------
let colors=DEFAULT.slice(), cur='A', anyMode=false;
try{ const s=JSON.parse(localStorage.getItem('dotletters')||'null'); if(s&&s.done&&s.done.length===LET.length){ colors=s.colors; s.done.forEach((d,i)=>{LET[i].done=!!d; LET[i].k=d||1;}); } }catch(e){}
function save(){ try{ localStorage.setItem('dotletters',JSON.stringify({colors,done:LET.map(l=>l.done?+(l.k||1).toFixed(2):0)})); }catch(e){} }

// ---------- Drawing ----------
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const dpr=Math.min(2,window.devicePixelRatio||1);
cv.width=W*dpr; cv.height=H*dpr; ctx.scale(dpr,dpr);
const pops=[]; // dot pop animations
function draw(t){
  ctx.clearRect(0,0,W,H);
  const paper=getComputedStyle(document.documentElement).getPropertyValue('--paper').trim();
  const ink=getComputedStyle(document.documentElement).getPropertyValue('--line').trim();
  ctx.fillStyle=paper; ctx.fillRect(0,0,W,H);
  // faint outlines of the scene, like the printed line art
  ctx.strokeStyle=ink; ctx.lineWidth=1.2;
  REGIONS.slice(1).forEach(r=>ctx.stroke(r.p));
  // letters
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const L of LET){
    if(L.done) continue;
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--muted').trim();
    ctx.font=(L.big?'700 15px':'700 9px')+' Nunito, sans-serif';
    ctx.fillText(L.l,L.x,L.y);
  }
  // dots
  for(const L of LET){
    if(!L.done) continue;
    const r=(L.big?13:7.5)*(L.k||1);
    ctx.fillStyle=colors[LETTERS.indexOf(L.l)]; ctx.globalAlpha=.92;
    ctx.beginPath(); ctx.arc(L.x,L.y,r,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1;
  }
  // pops (expanding ring)
  for(let i=pops.length-1;i>=0;i--){ const p=pops[i], k=(t-p.t)/260; if(k>=1){pops.splice(i,1);continue}
    ctx.strokeStyle=p.c; ctx.globalAlpha=1-k; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(p.x,p.y,p.r+k*10,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1; }
  if(pops.length) requestAnimationFrame(draw);
}
document.fonts&&document.fonts.ready.then(()=>draw(0)); draw(0);

// ---------- Sound: a soft marker tap ----------
let AC=null;
function tap(big){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(), g=AC.createGain();
  o.type='sine'; o.frequency.value=big?220:330; g.gain.setValueAtTime(.0001,AC.currentTime); g.gain.exponentialRampToValueAtTime(.25,AC.currentTime+.01); g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.09);
  o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime+.1);}catch(e){} }

// ---------- Interaction ----------
function canvasPoint(e){ const b=cv.getBoundingClientRect(); return {x:(e.clientX-b.left)*W/b.width, y:(e.clientY-b.top)*H/b.height}; }
let down=false;
function hit(pt,pressure){
  let best=null,bd=1e9;
  for(const L of LET){ if(L.done) continue; const d=Math.hypot(L.x-pt.x,L.y-pt.y); const reach=L.big?16:11; if(d<reach&&d<bd){bd=d;best=L} }
  if(!best) return;
  if(!anyMode && best.l!==cur) return;      // in flow mode, only the chosen letter accepts a dot
  // Pencil pressure: light tap = tidy dot, firm press = ink spreads (0.85x .. 1.3x)
  best.k = 0.85 + Math.min(1,Math.max(0,pressure))*0.45;
  best.done=true; pops.push({x:best.x,y:best.y,r:(best.big?13:7.5)*best.k,c:colors[LETTERS.indexOf(best.l)],t:performance.now()});
  if(navigator.vibrate) navigator.vibrate(8);
  tap(best.big); save(); renderKey(); requestAnimationFrame(draw);
}
// Palm rejection: once a pen has been seen, finger touches are ignored (unless "Pencil only" is off and no pen touched for 3 s).
let penSeen=0, penOnly=false;
function accept(e){
  if(e.pointerType==='pen'){ penSeen=performance.now(); return true; }
  if(e.pointerType==='touch'){ if(penOnly) return false; return performance.now()-penSeen>3000; }
  return true; // mouse
}
function pressureOf(e){ return e.pointerType==='pen' ? (e.pressure||0.5) : 0.5; }
cv.addEventListener('pointerdown',e=>{ if(!accept(e)) return; down=true; cv.setPointerCapture(e.pointerId); hit(canvasPoint(e),pressureOf(e)); });
cv.addEventListener('pointermove',e=>{ if(down&&accept(e)) hit(canvasPoint(e),pressureOf(e)); });
cv.addEventListener('pointerup',()=>down=false); cv.addEventListener('pointercancel',()=>down=false);
document.getElementById('pen').onclick=function(){ penOnly=!penOnly; this.textContent='Pencil only: '+(penOnly?'on':'off'); };

// ---------- Tray UI ----------
const keyEl=document.getElementById('key'), palEl=document.getElementById('pal');
function renderKey(){
  keyEl.innerHTML='';
  LETTERS.forEach((l,i)=>{
    const all=LET.filter(x=>x.l===l), n=all.filter(x=>x.done).length, pct=Math.round(100*n/all.length);
    const b=document.createElement('button'); b.className='k'+(l===cur?' on':'')+(pct===100?' done':''); b.id='key-'+l;
    b.innerHTML=`<span class="sw" style="background:${colors[i]}"></span>${l}<span class="pct">${pct}%</span>`;
    b.onclick=()=>{cur=l; document.getElementById('curL').textContent=l; renderKey(); renderPal();};
    keyEl.appendChild(b);
  });
  const total=LET.filter(x=>x.done).length;
  document.getElementById('hint').textContent= total===LET.length ? 'Page complete. Lovely.' : `${total} of ${LET.length} dots placed`;
}
function renderPal(){
  palEl.innerHTML='';
  PALETTE.forEach(c=>{ const b=document.createElement('button'); b.style.background=c; b.title=c; b.id='pal-'+c.slice(1);
    b.style.outline = colors[LETTERS.indexOf(cur)]===c ? '3px solid var(--ink)' : '';
    b.onclick=()=>{ colors[LETTERS.indexOf(cur)]=c; save(); renderKey(); renderPal(); draw(0); }; palEl.appendChild(b); });
}
document.getElementById('auto').onclick=function(){ anyMode=!anyMode; this.textContent='Any letter mode: '+(anyMode?'on':'off'); };
document.getElementById('reset').onclick=()=>{ LET.forEach(l=>l.done=false); save(); renderKey(); draw(0); };
renderKey(); renderPal();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>draw(0));
</script>

<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");</script></body></html>
